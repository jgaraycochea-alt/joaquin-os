const fmt = (d) => {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
};
const today = () => fmt(new Date());
const todayDow = () => new Date().getDay();

function daysSincePlan() {
  const now = new Date(); now.setHours(0,0,0,0);
  const start = new Date(PLAN_START); start.setHours(0,0,0,0);
  return Math.floor((now - start) / 86400000);
}

function getWeekNumber() {
  const d = daysSincePlan();
  return Math.floor(d / 7) + 1;
}

function getGymRotation(dateObj) {
  const d = new Date(dateObj); d.setHours(0,0,0,0);
  const start = new Date(PLAN_START); start.setHours(0,0,0,0);
  const daysSince = Math.floor((d - start) / 86400000);
  const weekNum = Math.floor(daysSince / 7);
  const dow = d.getDay(); // 0=Sun,1=Mon,...
  const gymDays = [0,1,3,5]; // Sun Mon Wed Fri
  const gymDayIndex = gymDays.indexOf(dow);
  if (gymDayIndex === -1) return null;
  const gymCount = weekNum * 4 + gymDayIndex;
  const routines = ['A','B','C'];
  return routines[gymCount % 3];
}

function getTodayActivity(dateObj) {
  const dow = (dateObj || new Date()).getDay();
  const sched = SCHEDULE[dow];
  const isGym = sched.gymDay;
  const rotation = isGym ? getGymRotation(dateObj || new Date()) : null;
  return { ...sched, rotation, isGym, isClassNight: !!sched.classNight };
}

function getGreeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Buenos días';
  if (h < 19) return 'Buenas tardes';
  return 'Buenas noches';
}

function computeScore(meals, water, habits, training, isGym, isGymDay) {
  let points = 0, max = 0;
  ['breakfast','lunch','snack','dinner'].forEach(k => {
    max++; if (meals[k]) points++;
  });
  max += 2; if (training.done) points += 2;
  const allHabits = [...MORNING_HABITS, ...EVENING_HABITS];
  allHabits.forEach(h => {
    if (h.gymOnly && !isGymDay) return;
    max++; if (habits[h.id]) points++;
  });
  max++; if ((water||0) >= 2500) points++;
  return max === 0 ? 0 : Math.round((points / max) * 100);
}

function getScoreColor(score) {
  if (score >= 80) return '#4A7C6F';
  if (score >= 50) return '#E0B040';
  return '#C66054';
}

function formatDate(d) {
  const days = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

// ─── HOOKS ────────────────────────────────────────────────────────────────────

function useLS(key, def) {
  const [val, setVal] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : def; }
    catch { return def; }
  });
  const set = useCallback((v) => {
    const nv = typeof v === 'function' ? v(val) : v;
    setVal(nv);
    try { localStorage.setItem(key, JSON.stringify(nv)); } catch {}
  }, [key, val]);
  return [val, set];
}

function useDailyReset(meals, setMeals, water, setWater, habits, setHabits, training, setTraining, trackers, setTrackers) {
  const [lastDate, setLastDate] = useLS('lastDate', '');
  const [history, setHistory] = useLS('history', {});

  useEffect(() => {
    const t = today();
    if (lastDate && lastDate !== t) {
      const snap = { meals, water, habits, training, trackers, date: lastDate };
      setHistory(h => ({ ...h, [lastDate]: snap }));
      setMeals({ breakfast:false, lunch:false, snack:false, dinner:false });
      setWater(0);
      const nh = {};
      [...MORNING_HABITS, ...EVENING_HABITS].forEach(h => { nh[h.id] = false; });
      setHabits(nh);
      setTraining({ done:false, series:{} });
      setTrackers({ reading:0, podcast:0, study:0, steps:0 });
    }
    if (lastDate !== t) setLastDate(t);
  }, []);

  return history;
}

function useHabitStreaks(history) {
  return useMemo(() => {
    const streaks = {};
    const allH = [...MORNING_HABITS, ...EVENING_HABITS];
    allH.forEach(h => {
      let streak = 0;
      const dates = Object.keys(history).sort().reverse();
      for (const d of dates) {
        if (history[d]?.habits?.[h.id]) streak++;
        else break;
      }
      streaks[h.id] = streak;
    });
    return streaks;
  }, [history]);
}

function Confetti({ active }) {
  if (!active) return null;
  const pieces = Array.from({length:80}, (_,i) => ({
    id:i,
    left: Math.random()*100,
    delay: Math.random()*1.5,
    duration: 2.5 + Math.random()*1.5,
    color: ['#4A7C6F','#F2D98A','#D4EDE8','#1A2332','#E07040','#A3D4C8','#FFD700'][Math.floor(Math.random()*7)],
    size: 6 + Math.random()*8,
    rotation: Math.random()*360,
  }));
  return (
    <div className="fixed inset-0 pointer-events-none z-50">
      {pieces.map(p => (
        <div key={p.id} className="confetti-piece" style={{
          left:`${p.left}%`, width:p.size, height:p.size*0.6, background:p.color,
          animationDelay:`${p.delay}s`, animationDuration:`${p.duration}s`,
          transform:`rotate(${p.rotation}deg)`
        }}/>
      ))}
      <div className="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center">
        <div className="font-display text-3xl text-navy dark:text-cream font-bold bg-white dark:bg-navy2 px-6 py-4 rounded-2xl shadow-2xl">
          🏆 Día perfecto, Joaquin!
        </div>
      </div>
    </div>
  );
}

// ─── ATOM COMPONENTS ──────────────────────────────────────────────────────────

function Card({ children, className='', dark=false, onClick }) {
  const base = dark
    ? 'bg-navy text-cream rounded-2xl p-4 shadow-lg'
    : 'bg-cream2 dark:bg-navy2 text-navy dark:text-cream rounded-2xl p-4 shadow-sm';
  return <div className={`${base} ${className}`} onClick={onClick}>{children}</div>;
}

function Pill({ label, color='sage', size='sm' }) {
  const colors = {
    sage:'bg-l-sage text-sage-d', amber:'bg-amber text-yellow-700',
    red:'bg-red-50 text-red-700', navy:'bg-navy text-cream',
    mint:'bg-mint text-sage-d', gray:'bg-gray-100 dark:bg-gray-700 text-ash dark:text-gray-300',
  };
  const sz = size==='sm' ? 'text-xs px-2 py-0.5 rounded-full font-medium' : 'text-xs px-3 py-1 rounded-full font-semibold';
  return <span className={`${colors[color]||colors.sage} ${sz} inline-block`}>{label}</span>;
}

function ProgressBar({ value, max, color='#4A7C6F', height=8, className='' }) {
  const pct = Math.min(100, Math.round((value/max)*100));
  return (
    <div className={`bg-gray-100 dark:bg-navy rounded-full overflow-hidden ${className}`} style={{height}}>
      <div className="h-full rounded-full transition-all duration-500" style={{width:`${pct}%`,background:color}}/>
    </div>
  );
}

function CheckItem({ label, checked, onToggle, className='', sub }) {
  return (
    <div className={`flex items-center gap-3 py-3 border-b border-gray-100 dark:border-navy last:border-0 cursor-pointer select-none ${className}`} onClick={onToggle}>
      <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-all duration-200 ${checked ? 'bg-sage border-sage' : 'border-gray-300 dark:border-gray-600'}`}>
        {checked && <Icon name="check" size={12} stroke="white"/>}
      </div>
      <div className="flex-1 min-w-0">
        <span className={`text-sm font-medium ${checked ? 'line-through text-ash' : 'text-navy dark:text-cream'}`}>{label}</span>
        {sub && <p className="text-xs text-ash mt-0.5">{sub}</p>}
      </div>
    </div>
  );
}

function BannerWarn({ icon, text, color='amber', className='' }) {
  const colors = { amber:'bg-amber border-amber-b text-yellow-800', green:'bg-l-sage border-mint text-sage-d', red:'bg-red-50 border-red-200 text-red-700' };
  return (
    <div className={`flex items-center gap-2 p-3 rounded-xl border ${colors[color]} ${className}`}>
      <Icon name={icon} size={16} stroke="currentColor"/>
      <span className="text-xs font-medium">{text}</span>
    </div>
  );
}

// ─── SCORE RING ───────────────────────────────────────────────────────────────

function ScoreRing({ score, size=120, strokeWidth=10 }) {
  const r = (size - strokeWidth*2) / 2;
  const circ = 2 * Math.PI * r;
  const pct = score / 100;
  const offset = circ - pct * circ;
  const color = getScoreColor(score);
  return (
    <svg width={size} height={size} style={{display:'block'}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,.15)" strokeWidth={strokeWidth}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={strokeWidth}
        strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
        className="progress-ring__circle" transform={`rotate(-90 ${size/2} ${size/2})`}/>
      <text x="50%" y="50%" textAnchor="middle" dominantBaseline="central"
        style={{fontSize:size*0.22,fontWeight:700,fontFamily:'JetBrains Mono',fill:'white'}}>
        {score}%
      </text>
    </svg>
  );
}

// ─── WATER TRACKER ────────────────────────────────────────────────────────────

function WaterTracker({ water, setWater }) {
  const goal = 3000;
  const pct = Math.min(100, Math.round((water/goal)*100));
  const add = (ml) => setWater(w => Math.min(goal+500, w+ml));
  const bottles = Math.floor(water/250);
  return (
    <Card className="mb-3">
      <div className="flex items-center justify-between mb-3">
        <div className="flex items-center gap-2">
          <Icon name="drop" size={18} stroke="#4A7C6F"/>
          <span className="font-semibold text-navy dark:text-cream text-sm">Agua</span>
        </div>
        <span className="font-mono text-sm font-bold text-sage">{(water/1000).toFixed(2)}L / 3L</span>
      </div>
      <ProgressBar value={water} max={goal} height={10} className="mb-3"/>
      <div className="flex gap-2 mt-1 flex-wrap">
        {[250,500].map(ml => (
          <button key={ml} onClick={() => add(ml)}
            className="flex-1 bg-l-sage dark:bg-navy text-sage-d dark:text-mint text-xs font-semibold py-2 rounded-xl active:scale-95 transition-transform">
            +{ml}ml
          </button>
        ))}
        {water > 0 && (
          <button onClick={() => setWater(w => Math.max(0, w-250))}
            className="bg-cream2 dark:bg-navy text-ash text-xs font-medium py-2 px-3 rounded-xl active:scale-95 transition-transform">
            −
          </button>
        )}
      </div>
      {water >= 2500 && <p className="text-xs text-sage mt-2 font-medium">✓ Meta diaria alcanzada 💧</p>}
    </Card>
  );
}

// ─── WORKOUT SCREEN ───────────────────────────────────────────────────────────

function WorkoutScreen({ training, setTraining }) {
  const [selDay, setSelDay] = useState(new Date().getDay());
  const [selWeek, setSelWeek] = useState(() => {
    try { return parseInt(localStorage.getItem('currentWeek')) || 1; } catch { return 1; }
  });
  const [expandBlock, setExpandBlock] = useState({});

  useEffect(() => {
    try { localStorage.setItem('currentWeek', String(selWeek)); } catch {}
  }, [selWeek]);

  const days = [1,2,3,4,5,6,0];
  const today = new Date().getDay();

  function getDayInfo(dow) {
    const sched = SCHEDULE[dow];
    if (!sched) return null;
    const now = new Date();
    const d = new Date(now);
    const diff = dow - now.getDay();
    d.setDate(d.getDate() + diff);
    return { ...sched, rotation: sched.gymDay ? getGymRotation(d) : null, dow };
  }

  const selInfo = getDayInfo(selDay);
  const routine = selInfo?.rotation ? ROUTINES[selInfo.rotation] : null;

  function getWeightForSet(weights, weekIdx) {
    if (!weights || !weights.length) return '—';
    const idx = Math.min(weekIdx, weights.length-1);
    return weights[idx] || weights[weights.length-1];
  }

  const wIdx = selWeek - 1;

  function toggleSeries(exId, sIdx) {
    setTraining(t => {
      const series = t.series || {};
      const exSeries = series[exId] || [];
      const newSeries = [...exSeries];
      newSeries[sIdx] = !newSeries[sIdx];
      return { ...t, series: { ...series, [exId]: newSeries } };
    });
  }

  function isSeriesDone(exId, sIdx) {
    return !!(training.series?.[exId]?.[sIdx]);
  }

  const muscleColors = {

                    <Icon name={expandBlock[bIdx]===false?'chev_right':'chev_down'} size={16} stroke="#6B7280"/>

                  {expandBlock[bIdx]!==false && (

                      {block.exercises.map(ex => {

                              <div className="flex-1">
                                <div className="flex items-center gap-2 flex-wrap mb-1">

                                  {ex.target && <span className="text-xs text-ash">→ {ex.target}</span>}
                                </div>
                                <p className="font-semibold text-navy dark:text-cream text-sm">{ex.name}</p>
                                <p className="text-xs text-ash mt-0.5">{ex.cue}</p>
                              </div>
                            </div>
                            <div className="flex items-center justify-between mt-2">
                              <div>
                                <span className="font-mono text-xs font-bold text-sage">{getWeightForSet(ex.weights, wIdx)}</span>
                                <span className="text-xs text-ash ml-2">{ex.reps}</span>

                              <div className="flex gap-1">
                                {Array.from({length:numSets},(_,i)=>i).map(i => (
                                  <button key={i} onClick={() => toggleSeries(ex.id, i)}
                                    className={`w-7 h-7 rounded-full text-xs font-bold transition-all ${isSeriesDone(ex.id,i) ? 'bg-sage text-cream' : 'bg-gray-100 dark:bg-navy text-ash border border-gray-200 dark:border-gray-700'}`}>
                                    {i+1}
                                  </button>
                                ))}
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              ))}

              {/* Mark done button */}
              <button onClick={() => setTraining(t => ({...t, done:!t.done}))}
                className={`w-full py-4 rounded-2xl font-bold text-sm transition-all active:scale-95 ${training.done ? 'bg-sage text-cream' : 'bg-navy text-cream'}`}>
                {training.done ? '✓ Sesión completada' : 'Marcar sesión completa'}
              </button>

              {/* Scoliosis card */}
              <div className="mt-4 bg-amber border border-amber-b rounded-2xl p-4">
                <p className="font-semibold text-yellow-800 text-sm mb-2">⚠️ Protocolo escoliosis</p>
                <ul className="text-xs text-yellow-700 space-y-1 list-disc pl-4">
                  <li>Calentar columna 5min antes: gatos-vacas, rotaciones</li>
                  <li>Evitar cargas asimétricas pesadas sin supervisión</li>
                  <li>Fortalecer core en TODOS los bloques 4</li>
                  <li>Terminar con 5min de stretching posterior</li>
                </ul>
              </div>
            </>
          ) : (
            <Card>
              <div className="flex items-center gap-3">
                {selInfo.activity === 'cardio' ? <Icon name="run" size={24} stroke="#4A7C6F"/> : <Icon name="volleyball" size={24} stroke="#4A7C6F"/>}
                <div>
                  <p className="font-semibold text-navy dark:text-cream">{selInfo.activity === 'cardio' ? 'Cardio Zona 2' : 'Descanso activo'}</p>
                  <p className="text-xs text-ash">{selInfo.extra || 'Recuperación'}</p>
                </div>
              </div>
              {selInfo.activity === 'cardio' && (
                <div className="mt-3 space-y-1 text-xs text-ash">
                  <p>• Duración: 35-40 minutos</p>
                  <p>• Frecuencia cardíaca: 120-140 bpm</p>
                  <p>• Modalidad: carrera / bici / caminata</p>
                </div>
              )}
            </Card>
          )}
        </>
      )}
    </div>
  );
}

// ─── HABITS SCREEN ────────────────────────────────────────────────────────────

function HabitsScreen({ habits, setHabits, trackers, setTrackers, history, training, meals, water }) {
  const act = getTodayActivity();
  const streaks = useHabitStreaks(history);
  const allHabits = [...MORNING_HABITS, ...EVENING_HABITS];
  const amDone = MORNING_HABITS.filter(h => (!h.gymOnly || act.gymDay) && habits[h.id]).length;
  const amTotal = MORNING_HABITS.filter(h => !h.gymOnly || act.gymDay).length;
  const pmDone = EVENING_HABITS.filter(h => habits[h.id]).length;

  function toggleH(id) { setHabits(h => ({...h,[id]:!h[id]})); }
  function adjustTracker(id, delta) {
    setTrackers(t => {
      const trk = TRACKERS.find(x => x.id === id);
      const val = Math.max(0, Math.min(trk.goal*3, (t[id]||0) + delta));
      return {...t, [id]:val};
    });
  }

  return (
    <div className="fade-up pb-28 px-4 pt-4">
      <h2 className="font-display text-xl font-bold text-navy dark:text-cream mb-4">Hábitos</h2>

      {/* Progress bars */}
      <div className="grid grid-cols-2 gap-3 mb-4">
        {[
          {l:'Mañana',v:amDone,m:amTotal,c:'#4A7C6F'},
          {l:'Noche',v:pmDone,m:EVENING_HABITS.length,c:'#243044'},
          {l:'Comidas',v:Object.values(meals).filter(Boolean).length,m:4,c:'#E0B040'},
          {l:'Agua',v:Math.min(3000,water||0),m:3000,c:'#4A7C6F'},
        ].map(({l,v,m,c}) => (
          <div key={l} className="bg-cream2 dark:bg-navy2 rounded-2xl p-3">
            <div className="flex justify-between text-xs mb-1">
              <span className="text-ash font-medium">{l}</span>
              <span className="font-mono font-bold text-navy dark:text-cream">{l==='Agua'?`${(v/1000).toFixed(1)}L`:`${v}/${m}`}</span>
            </div>
            <ProgressBar value={v} max={m} color={c} height={6}/>
          </div>
        ))}
      </div>

      {/* Morning habits */}
      <div className="mb-4">
        <div className="flex items-center gap-2 mb-2">
          <Icon name="sun" size={16} stroke="#4A7C6F"/>
          <h3 className="font-semibold text-navy dark:text-cream text-sm">Rutina de mañana</h3>
          <span className="text-xs text-ash ml-auto">{amDone}/{amTotal}</span>
        </div>
        <Card>
          {MORNING_HABITS.filter(h => !h.gymOnly || act.gymDay).map(h => (
            <div key={h.id} className="flex items-center gap-3 py-3 border-b border-gray-100 dark:border-navy last:border-0 cursor-pointer" onClick={() => toggleH(h.id)}>
              <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-all duration-200 ${habits[h.id] ? 'bg-sage border-sage' : 'border-gray-300 dark:border-gray-600'}`}>
                {habits[h.id] && <Icon name="check" size={12} stroke="white"/>}
              </div>
              <div className="flex items-center gap-2 flex-1 min-w-0">
                <Icon name={h.icon} size={14} stroke={habits[h.id]?'#4A7C6F':'#6B7280'}/>
                <span className={`text-xs flex-1 ${habits[h.id] ? 'line-through text-ash' : 'text-navy dark:text-cream'}`}>{h.label}</span>
              </div>
              {streaks[h.id] >= 2 && (
                <span className="text-xs bg-amber-b text-yellow-800 px-2 py-0.5 rounded-full font-bold flex-shrink-0">🔥 {streaks[h.id]}d</span>
              )}
            </div>
          ))}
        </Card>
      </div>

      {/* Evening habits */}
      <div className="mb-4">
        <div className="flex items-center gap-2 mb-2">
          <Icon name="moon" size={16} stroke="#3A6358"/>
          <h3 className="font-semibold text-navy dark:text-cream text-sm">Rutina de noche</h3>
          <span className="text-xs text-ash ml-auto">{pmDone}/{EVENING_HABITS.length}</span>
        </div>
        <Card>
          {EVENING_HABITS.map(h => (
            <div key={h.id} className="flex items-center gap-3 py-3 border-b border-gray-100 dark:border-navy last:border-0 cursor-pointer" onClick={() => toggleH(h.id)}>
              <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-all duration-200 ${habits[h.id] ? 'bg-navy border-navy' : 'border-gray-300 dark:border-gray-600'}`}>
                {habits[h.id] && <Icon name="check" size={12} stroke="white"/>}
              </div>
              <div className="flex items-center gap-2 flex-1 min-w-0">
                <Icon name={h.icon} size={14} stroke={habits[h.id]?'#3A6358':'#6B7280'}/>
                <span className={`text-xs flex-1 ${habits[h.id] ? 'line-through text-ash' : 'text-navy dark:text-cream'}`}>{h.label}</span>
              </div>
              {streaks[h.id] >= 2 && (
                <span className="text-xs bg-amber-b text-yellow-800 px-2 py-0.5 rounded-full font-bold flex-shrink-0">🔥 {streaks[h.id]}d</span>
              )}
            </div>
          ))}
        </Card>
      </div>

      {/* Trackers */}
      <div>
        <h3 className="font-semibold text-navy dark:text-cream text-sm mb-3">Metas del día</h3>
        <div className="space-y-3">
          {TRACKERS.map(trk => {
            const val = trackers[trk.id] || 0;
            const pct = Math.min(100, Math.round((val/trk.goal)*100));
            return (
              <Card key={trk.id}>
                <div className="flex items-center justify-between mb-2">
                  <div className="flex items-center gap-2">
                    <Icon name={trk.icon} size={16} stroke="#4A7C6F"/>
                    <span className="font-medium text-sm text-navy dark:text-cream">{trk.label}</span>
                  </div>
                  <span className="font-mono text-sm font-bold text-sage">{val}<span className="text-ash text-xs">/{trk.goal} {trk.unit}</span></span>
                </div>
                <ProgressBar value={val} max={trk.goal} height={8} className="mb-3"/>
                <div className="flex gap-2">
                  <button onClick={() => adjustTracker(trk.id, -trk.step)}
                    className="w-9 h-9 rounded-xl bg-cream dark:bg-navy flex items-center justify-center active:scale-95 transition-transform">
                    <Icon name="minus" size={16} stroke="#6B7280"/>
                  </button>
                  <div className="flex-1 flex items-center justify-center text-xs text-ash">+{trk.step} {trk.unit}</div>
                  <button onClick={() => adjustTracker(trk.id, trk.step)}
                    className="w-9 h-9 rounded-xl bg-l-sage dark:bg-navy2 flex items-center justify-center active:scale-95 transition-transform">
                    <Icon name="plus" size={16} stroke="#4A7C6F"/>
                  </button>
                </div>
              </Card>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ─── TODO SCREEN ──────────────────────────────────────────────────────────────

function TodoScreen({ todos, setTodos }) {
  const [filter, setFilter] = useState('Todas');
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({ title:'', note:'', priority:'Media', dueDate:'', pinned:false });
  const [deleteId, setDeleteId] = useState(null);
  const inputRef = useRef(null);

  const todayStr = today();
  const priorityColors = { Alta:'red', Media:'amber', Baja:'sage' };
  const priorityBg = { Alta:'bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-400', Media:'bg-amber text-yellow-700', Baja:'bg-l-sage text-sage-d' };

  const filtered = useMemo(() => {
    let list = [...todos];
    if (filter !== 'Todas') list = list.filter(t => t.priority === filter);
    return list;
  }, [todos, filter]);

  const hoy = filtered.filter(t => !t.done && (t.pinned || t.dueDate === todayStr));
  const pendientes = filtered.filter(t => !t.done && !t.pinned && t.dueDate !== todayStr);
  const completadas = filtered.filter(t => t.done);

  function addTodo() {
    if (!form.title.trim()) return;
    const newTodo = { id:Date.now().toString(), ...form, done:false, createdAt:todayStr };
    setTodos(t => [newTodo, ...t]);
    setForm({ title:'', note:'', priority:'Media', dueDate:'', pinned:false });
    setShowAdd(false);
  }

  function toggleDone(id) {
    setTodos(t => t.map(x => x.id===id ? {...x,done:!x.done} : x));
  }

  function deleteTodo(id) {
    setTodos(t => t.filter(x => x.id!==id));
    setDeleteId(null);
  }

  function togglePin(id) {
    setTodos(t => t.map(x => x.id===id ? {...x,pinned:!x.pinned} : x));
  }

  const pendingCount = todos.filter(t => !t.done).length;

  function TodoItem2({ todo }) {
    return (
      <div className={`flex items-start gap-3 py-3 border-b border-gray-100 dark:border-navy last:border-0 transition-all ${deleteId===todo.id ? 'bg-red-50 dark:bg-red-900/20' : ''}`}>
        <button onClick={() => toggleDone(todo.id)}
          className={`w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 mt-0.5 transition-all ${todo.done ? 'bg-sage border-sage' : 'border-gray-300 dark:border-gray-600'}`}>
          {todo.done && <Icon name="check" size={12} stroke="white"/>}
        </button>
        <div className="flex-1 min-w-0" onClick={() => toggleDone(todo.id)}>
          <div className="flex items-center gap-2 flex-wrap">
            <span className={`text-sm font-medium ${todo.done ? 'line-through text-ash' : 'text-navy dark:text-cream'}`}>{todo.title}</span>
            <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${priorityBg[todo.priority]}`}>{todo.priority}</span>
            {todo.pinned && <Icon name="pin" size={12} stroke="#4A7C6F"/>}
          </div>
          {todo.note && <p className="text-xs text-ash mt-0.5 truncate">{todo.note}</p>}
          {todo.dueDate && <p className="text-xs text-ash">{todo.dueDate}</p>}
        </div>
        <div className="flex gap-1 flex-shrink-0">
          {!todo.done && (
            <button onClick={() => togglePin(todo.id)} className="w-7 h-7 rounded-lg flex items-center justify-center active:scale-95">
              <Icon name="pin" size={14} stroke={todo.pinned?'#4A7C6F':'#6B7280'}/>
            </button>
          )}
          <button onClick={() => setDeleteId(deleteId===todo.id?null:todo.id)} className="w-7 h-7 rounded-lg flex items-center justify-center active:scale-95">
            <Icon name="trash" size={14} stroke={deleteId===todo.id?'#C66054':'#6B7280'}/>
          </button>
          {deleteId===todo.id && (
            <button onClick={() => deleteTodo(todo.id)} className="bg-red-500 text-white text-xs px-2 rounded-lg font-bold active:scale-95">✓</button>
          )}
        </div>
      </div>
    );
  }

  return (
    <div className="fade-up pb-36 px-4 pt-4">
      <div className="flex items-center justify-between mb-4">
        <h2 className="font-display text-xl font-bold text-navy dark:text-cream">Tareas</h2>
        {pendingCount > 0 && <span className="bg-sage text-cream text-xs font-bold px-2 py-1 rounded-full">{pendingCount}</span>}
      </div>

      {/* Filters */}
      <div className="flex gap-2 mb-4 overflow-x-auto no-scrollbar">
        {['Todas','Alta','Media','Baja'].map(f => (
          <button key={f} onClick={() => setFilter(f)}
            className={`px-3 py-1.5 rounded-xl text-xs font-semibold flex-shrink-0 transition-all ${filter===f ? 'bg-navy text-cream' : 'bg-cream2 dark:bg-navy2 text-ash'}`}>
            {f}
          </button>
        ))}
        {completadas.length > 0 && (
          <button onClick={() => setTodos(t => t.filter(x => !x.done))}
            className="px-3 py-1.5 rounded-xl text-xs font-semibold flex-shrink-0 text-red-500 bg-red-50 dark:bg-red-900/20 ml-auto">
            Limpiar ({completadas.length})
          </button>
        )}
      </div>

      {/* Hoy */}
      {hoy.length > 0 && (
        <div className="mb-4">
          <p className="text-xs font-bold text-ash uppercase tracking-wide mb-2">Hoy</p>
          <Card>{hoy.map(t => <TodoItem2 key={t.id} todo={t}/>)}</Card>
        </div>
      )}

      {/* Pendientes */}
      {pendientes.length > 0 && (
        <div className="mb-4">
          <p className="text-xs font-bold text-ash uppercase tracking-wide mb-2">Pendientes</p>
          <Card>{pendientes.map(t => <TodoItem2 key={t.id} todo={t}/>)}</Card>
        </div>
      )}

      {/* Completadas */}
      {completadas.length > 0 && (
        <div className="mb-4">
          <p className="text-xs font-bold text-ash uppercase tracking-wide mb-2">Completadas</p>
          <Card className="opacity-70">{completadas.map(t => <TodoItem2 key={t.id} todo={t}/>)}</Card>
        </div>
      )}

      {todos.filter(t=>!t.done).length === 0 && todos.length === 0 && (
        <div className="text-center py-16">
          <p className="text-2xl mb-2">✨</p>
          <p className="text-ash font-medium">Todo limpio · ¿qué sigue?</p>
        </div>
      )}

      {/* Quick add */}
      <div className="fixed bottom-20 left-0 right-0 px-4 max-w-md mx-auto z-30">
        {showAdd ? (
          <div className="bg-white dark:bg-navy2 rounded-2xl shadow-2xl p-4 border border-gray-100 dark:border-gray-700">
            <input ref={inputRef} value={form.title} onChange={e => setForm(f=>({...f,title:e.target.value}))}
              placeholder="Nueva tarea..." autoFocus
              className="w-full text-sm bg-transparent text-navy dark:text-cream outline-none mb-3 font-medium placeholder-ash"
              onKeyDown={e => e.key==='Enter' && addTodo()}/>
            <input value={form.note} onChange={e => setForm(f=>({...f,note:e.target.value}))}
              placeholder="Nota opcional..."
              className="w-full text-xs bg-transparent text-ash outline-none mb-3 placeholder-gray-300"/>
            <div className="flex gap-2 items-center flex-wrap">
              {['Alta','Media','Baja'].map(p => (
                <button key={p} onClick={() => setForm(f=>({...f,priority:p}))}
                  className={`text-xs px-3 py-1.5 rounded-xl font-semibold transition-all ${form.priority===p ? (p==='Alta'?'bg-red-500 text-white':p==='Media'?'bg-amber-b text-yellow-800':'bg-sage text-cream') : 'bg-gray-100 dark:bg-navy text-ash'}`}>
                  {p}
                </button>
              ))}
              <input type="date" value={form.dueDate} onChange={e => setForm(f=>({...f,dueDate:e.target.value}))}
                className="text-xs bg-gray-100 dark:bg-navy text-ash rounded-xl px-2 py-1.5 outline-none ml-auto"/>
            </div>
            <div className="flex gap-2 mt-3">
              <button onClick={() => setShowAdd(false)} className="flex-1 py-2 rounded-xl text-sm text-ash bg-gray-100 dark:bg-navy font-medium">Cancelar</button>
              <button onClick={addTodo} className="flex-1 py-2 rounded-xl text-sm text-cream bg-navy dark:bg-sage font-bold">Agregar</button>
            </div>
          </div>
        ) : (
          <button onClick={() => setShowAdd(true)}
            className="w-full bg-navy dark:bg-sage text-cream py-4 rounded-2xl font-semibold text-sm flex items-center justify-center gap-2 shadow-xl active:scale-95 transition-transform">
            <Icon name="plus" size={18} stroke="white"/>
            Agregar tarea
          </button>
        )}
      </div>
    </div>
  );
}

// ─── WEEK SCREEN ──────────────────────────────────────────────────────────────

function WeekScreen({ history, meals, water, habits, training, trackers }) {
  const now = new Date();
  const startOfWeek = new Date(now);
  startOfWeek.setDate(now.getDate() - ((now.getDay() + 6) % 7));

  const days = Array.from({length:7},(_,i) => {
    const d = new Date(startOfWeek);
    d.setDate(startOfWeek.getDate() + i);
    return d;
  });

  function getDayScore(dateObj) {
    const key = fmt(dateObj);
    const todayKey = today();
    if (key === todayKey) {
      const act = getTodayActivity(dateObj);
      return computeScore(meals, water, habits, training, act.isGym, act.gymDay);
    }
    const h = history[key];
    if (!h) return null;
    const act = getTodayActivity(dateObj);
    return computeScore(h.meals||{}, h.water||0, h.habits||{}, h.training||{}, act.isGym, act.gymDay);
  }

  const dayLabels = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const todayKey = today();
  const greenDays = days.filter(d => { const s = getDayScore(d); return s !== null && s >= 80; }).length;
  const totalDays = days.filter(d => fmt(d) <= todayKey).length;

  let streak = 0;
  for (let i = days.length-1; i >= 0; i--) {
    const s = getDayScore(days[i]);
    if (s !== null && s >= 80) streak++;
    else break;
  }

  // Stats
  const trainedDays = days.filter(d => {
    const key = fmt(d);
    if (key === todayKey) return training.done;
    return history[key]?.training?.done;
  }).length;

  const avgScore = useMemo(() => {
    const scores = days.map(getDayScore).filter(s => s !== null);
    return scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
  }, [days, history]);

  return (
    <div className="fade-up pb-28 px-4 pt-4">
      <h2 className="font-display text-xl font-bold text-navy dark:text-cream mb-4">Esta semana</h2>

      {/* Day strip */}
      <div className="flex gap-1.5 mb-4">
        {days.map((d,i) => {
          const score = getDayScore(d);
          const isToday = fmt(d) === todayKey;
          const isFuture = fmt(d) > todayKey;
          const bg = isToday ? '#1A2332' : isFuture ? '#F2EFEA' : score === null ? '#F2EFEA' : score >= 80 ? '#EAF2EF' : score >= 50 ? '#FEF9EC' : '#FEE2E2';
          const textColor = isToday ? 'text-cream' : 'text-navy dark:text-cream';
          const scoreColor = !isFuture && score !== null ? getScoreColor(score) : '#6B7280';
          const act = getTodayActivity(d);
          return (
            <div key={i} className="flex-1 rounded-2xl p-2 flex flex-col items-center gap-1" style={{background:bg}}>
              <span className={`text-xs font-semibold ${textColor} dark:text-cream`}>{dayLabels[i]}</span>
              <div className="text-base">
                {act.gymDay ? '💪' : act.activity==='cardio' ? (d.getDay()===6?'🏐':'🏃') : '😴'}
              </div>
              {score !== null && !isFuture ? (
                <span className="font-mono text-xs font-bold" style={{color:scoreColor}}>{score}%</span>
              ) : (
                <span className="text-xs text-ash">—</span>
              )}
              {isToday && <div className="w-1.5 h-1.5 rounded-full bg-sage"/>}
            </div>
          );
        })}
      </div>

      {/* Stats */}
      <div className="grid grid-cols-3 gap-3 mb-4">
        {[
          {l:'Score promedio', v:`${avgScore}%`, c:'#4A7C6F'},
          {l:'Días ≥80%', v:`${greenDays}/${totalDays}`, c:'#4A7C6F'},
          {l:'Racha actual', v:`${streak}d 🔥`, c:'#E0B040'},
        ].map(({l,v,c}) => (
          <div key={l} className="bg-cream2 dark:bg-navy2 rounded-2xl p-3 text-center">
            <p className="font-mono text-lg font-bold" style={{color:c}}>{v}</p>
            <p className="text-xs text-ash">{l}</p>
          </div>
        ))}
      </div>
      <div className="grid grid-cols-2 gap-3">
        {[
          {l:'Entrenos completados', v:`${trainedDays} sesiones`},
          {l:'Semana del plan', v:`S${getWeekNumber()}`},
        ].map(({l,v}) => (
          <div key={l} className="bg-cream2 dark:bg-navy2 rounded-2xl p-3">
            <p className="font-mono font-bold text-navy dark:text-cream">{v}</p>
            <p className="text-xs text-ash">{l}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── PROGRESS SCREEN ──────────────────────────────────────────────────────────

function ProgressScreen({ weightLog, setWeightLog }) {
  const [newWeight, setNewWeight] = useState('');
  const now = new Date();
  const isSunday = now.getDay() === 0;
  const daysToNextInBody = useMemo(() => {
    const start = new Date(PLAN_START);
    const d = new Date(now); d.setHours(0,0,0,0);
    const diff = Math.floor((d - start) / 86400000);
    const nextCheck = Math.ceil(diff / 28) * 28;
    return nextCheck - diff;
  }, []);

  const sorted = [...weightLog].sort((a,b) => a.date.localeCompare(b.date));
  const latest = sorted[sorted.length-1];
  const startWeight = 93.6;
  const cancunLow = 84, cancunHigh = 87;
  const midLow = 88, midHigh = 90;
  const todayKey = today();
  const alreadyLoggedToday = sorted.some(e => e.date === todayKey);

  function addWeight() {
    const w = parseFloat(newWeight);
    if (isNaN(w) || w < 40 || w > 200) return;
    const entry = { date: todayKey, weight: w };
    setWeightLog(prev => {
      const filtered = prev.filter(e => e.date !== todayKey);
      return [...filtered, entry].sort((a,b) => a.date.localeCompare(b.date));
    });
    setNewWeight('');
  }

  // SVG chart
  const chartW = 340, chartH = 160;
  const pad = { top:16, right:16, bottom:28, left:36 };
  const innerW = chartW - pad.left - pad.right;
  const innerH = chartH - pad.top - pad.bottom;

  const chartData = useMemo(() => {
    if (!sorted.length) return { points:'', cancunBand:'', midBand:'', xLabels:[], minY:80, maxY:95 };
    const weights = sorted.map(e => e.weight);
    const minY = Math.min(...weights, cancunLow) - 2;
    const maxY = Math.max(...weights, startWeight) + 1;
    const n = sorted.length;
    function toX(i) { return pad.left + (n===1 ? innerW/2 : (i/(n-1))*innerW); }
    function toY(w) { return pad.top + innerH - ((w - minY)/(maxY - minY))*innerH; }
    const points = sorted.map((e,i) => `${toX(i)},${toY(e.weight)}`).join(' ');
    const cancunY1 = toY(cancunHigh), cancunY2 = toY(cancunLow);
    const midY1 = toY(midHigh), midY2 = toY(midLow);
    const xLabels = sorted.filter((_,i) => i === 0 || i === sorted.length-1 || i % Math.max(1,Math.floor(n/4)) === 0)
      .map((e,_,arr) => {
        const i = sorted.indexOf(e);
        return { x:toX(i), label:e.date.slice(5) };
      });
    return { points, minY, maxY, toX, toY, cancunY1, cancunY2, midY1, midY2, xLabels };
  }, [sorted]);

  const changeFromStart = latest ? (latest.weight - startWeight).toFixed(1) : '—';

  return (
    <div className="fade-up pb-28 px-4 pt-4">
      <h2 className="font-display text-xl font-bold text-navy dark:text-cream mb-4">Progreso</h2>

      {isSunday && (
        <BannerWarn icon="camera" text="Domingo — toma foto de progreso 📸" color="amber" className="mb-4"/>
      )}

      {/* Big weight card */}
      <div className="bg-navy rounded-3xl p-5 mb-4 shadow-xl">
        <div className="flex items-end justify-between">
          <div>
            <p className="text-cream/60 text-xs mb-1">Peso actual</p>
            <div className="flex items-end gap-2">
              <span className="font-mono text-4xl font-bold text-cream">{latest?.weight || startWeight}</span>
              <span className="text-cream/60 text-sm mb-1">kg</span>
            </div>
            <p className={`text-xs mt-1 font-medium ${parseFloat(changeFromStart) < 0 ? 'text-mint' : 'text-amber-b'}`}>
              {changeFromStart !== '—' && parseFloat(changeFromStart) < 0 ? '↓' : '↑'} {Math.abs(parseFloat(changeFromStart)) || 0}kg desde inicio
            </p>
          </div>
          <div className="text-right">
            <p className="text-cream/60 text-xs mb-1">Grasa corporal</p>
            <span className="font-mono text-2xl font-bold text-cream">25.5</span>
            <span className="text-cream/60 text-sm">%</span>
            <p className="text-mint text-xs mt-1">Meta: 17-19%</p>
          </div>
        </div>
      </div>

      {/* Add weight */}
      <Card className="mb-4">
        <p className="text-xs font-semibold text-ash mb-2">Registrar peso de hoy</p>
        <div className="flex gap-2">
          <input type="number" value={newWeight} onChange={e => setNewWeight(e.target.value)}
            placeholder={latest?.weight || '93.6'} step="0.1"
            className="flex-1 bg-cream dark:bg-navy text-navy dark:text-cream text-sm font-mono px-3 py-2 rounded-xl outline-none border border-gray-200 dark:border-gray-700"
            onKeyDown={e => e.key==='Enter' && addWeight()}/>
          <button onClick={addWeight} className="bg-navy dark:bg-sage text-cream px-4 py-2 rounded-xl font-bold text-sm active:scale-95 transition-transform">
            {alreadyLoggedToday ? 'Update' : 'Agregar'}
          </button>
        </div>
      </Card>

      {/* Chart */}
      {sorted.length > 0 && (
        <Card className="mb-4 overflow-hidden p-3">
          <p className="text-xs font-semibold text-ash mb-2">Historial de peso</p>
          <svg width="100%" viewBox={`0 0 ${chartW} ${chartH}`} preserveAspectRatio="xMidYMid meet">
            {/* Bands */}
            {chartData.midY1 !== undefined && (
              <rect x={pad.left} y={chartData.midY1} width={innerW} height={chartData.midY2-chartData.midY1}
                fill="#D4EDE8" opacity=".5"/>
            )}
            {chartData.cancunY1 !== undefined && (
              <rect x={pad.left} y={chartData.cancunY1} width={innerW} height={chartData.cancunY2-chartData.cancunY1}
                fill="#EAF2EF" opacity=".6"/>
            )}
            {/* Grid lines */}
            {[0,0.25,0.5,0.75,1].map(pct => {
              const y = pad.top + innerH * pct;
              const wVal = chartData.maxY - (chartData.maxY - chartData.minY)*pct;
              return (
                <g key={pct}>
                  <line x1={pad.left} y1={y} x2={pad.left+innerW} y2={y} stroke="#E5E7EB" strokeWidth=".8"/>
                  <text x={pad.left-4} y={y+3} textAnchor="end" fontSize="9" fill="#6B7280">{wVal.toFixed(0)}</text>
                </g>
              );
            })}
            {/* Line */}
            {sorted.length > 1 && (
              <polyline points={chartData.points} fill="none" stroke="#4A7C6F" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
            )}
            {/* Dots */}
            {sorted.map((e,i) => {
              const n = sorted.length;
              const x = pad.left + (n===1 ? innerW/2 : (i/(n-1))*innerW);
              const y = pad.top + innerH - ((e.weight - chartData.minY)/(chartData.maxY - chartData.minY))*innerH;
              return <circle key={e.date} cx={x} cy={y} r="3.5" fill="#4A7C6F" stroke="white" strokeWidth="1.5"/>;
            })}
            {/* X labels */}
            {chartData.xLabels && chartData.xLabels.map(({x,label}) => (
              <text key={label} x={x} y={chartH-4} textAnchor="middle" fontSize="8" fill="#6B7280">{label}</text>
            ))}
            {/* Band labels */}
            {chartData.midY1 !== undefined && (
              <text x={pad.left+2} y={chartData.midY1-2} fontSize="7" fill="#4A7C6F" fontWeight="600">Meta Jul15</text>
            )}
            {chartData.cancunY1 !== undefined && (
              <text x={pad.left+2} y={chartData.cancunY1-2} fontSize="7" fill="#3A6358" fontWeight="600">Cancún</text>
            )}
          </svg>
        </Card>
      )}

      {/* Milestones */}
      <div className="space-y-3 mb-4">
        {[
          { label:'Inicio', date:'19 may', weight:`${startWeight}kg`, bf:'25.5%', done:true },
          { label:'Meta intermedia', date:'15 jul', weight:'88-90kg', bf:'20-22%', done:false },
          { label:'Cancún 🏖️', date:'5 ago', weight:'84-87kg', bf:'17-19%', done:false },
        ].map((m,i) => (
          <div key={i} className={`flex items-center gap-3 p-3 rounded-2xl ${m.done ? 'bg-l-sage' : 'bg-cream2 dark:bg-navy2'}`}>
            <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm flex-shrink-0 ${m.done ? 'bg-sage text-cream' : 'bg-gray-100 dark:bg-navy text-ash'}`}>
              {m.done ? '✓' : ['🎯','🏆'][i-1]}
            </div>
            <div className="flex-1">
              <p className="font-semibold text-navy dark:text-cream text-sm">{m.label}</p>
              <p className="text-xs text-ash">{m.date} · {m.weight} · {m.bf}</p>
            </div>
          </div>
        ))}
      </div>

      {/* InBody reminder */}
      <Card className="bg-amber border border-amber-b">
        <div className="flex items-center gap-2">
          <Icon name="scale" size={18} stroke="#92400E"/>
          <div>
            <p className="font-semibold text-yellow-800 text-sm">Próximo InBody</p>
            <p className="text-xs text-yellow-700">En {daysToNextInBody} días · cada 4 semanas desde el 19 may</p>
          </div>
        </div>
      </Card>

      {/* Weight log */}
      {sorted.length > 0 && (
        <div className="mt-4">
          <p className="text-xs font-semibold text-ash uppercase tracking-wide mb-2">Historial</p>
          <Card>
            {sorted.slice().reverse().slice(0,10).map(e => (
              <div key={e.date} className="flex items-center justify-between py-2 border-b border-gray-100 dark:border-navy last:border-0">
                <span className="text-xs text-ash">{e.date}</span>
                <span className="font-mono font-bold text-navy dark:text-cream text-sm">{e.weight}kg</span>
              </div>
            ))}
          </Card>
        </div>
      )}
    </div>
  );
}

// ─── APP ROOT ─────────────────────────────────────────────────────────────────

function App() {
  const [darkMode, setDarkMode] = useLS('darkMode', false);
  const [tab, setTab] = useState(0);
  const [meals, setMeals] = useLS('meals_today', { breakfast:false, lunch:false, snack:false, dinner:false });
  const [water, setWater] = useLS('water_today', 0);
  const [habits, setHabits] = useLS('habits_today', {});
  const [training, setTraining] = useLS('training_today', { done:false, series:{} });
  const [trackers, setTrackers] = useLS('trackers_today', { reading:0, podcast:0, study:0, steps:0 });
  const [weightLog, setWeightLog] = useLS('weightLog', []);
  const [todos, setTodos] = useLS('todos', []);

  const history = useDailyReset(meals, setMeals, water, setWater, habits, setHabits, training, setTraining, trackers, setTrackers);

  useEffect(() => {
    if (darkMode) document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  }, [darkMode]);

  const pendingTodos = todos.filter(t => !t.done).length;
  const act = getTodayActivity();

  const tabs = [
    { id:0, label:'Hoy', icon:'today' },
    { id:1, label:'Entreno', icon:'dumbbell' },
    { id:2, label:'Dieta', icon:'flame' },
    { id:3, label:'Hábitos', icon:'spark' },
    { id:4, label:'Todo', icon:'list', badge: pendingTodos > 0 ? pendingTodos : null },
    { id:5, label:'Semana', icon:'calendar' },
    { id:6, label:'Progreso', icon:'chart' },
  ];

  const screens = [
    <TodayScreen key="hoy" meals={meals} setMeals={setMeals} water={water} setWater={setWater}
      habits={habits} setHabits={setHabits} training={training} setTraining={setTraining} setTab={setTab}/>,
    <WorkoutScreen key="entreno" training={training} setTraining={setTraining}/>,
    <DietScreen key="dieta" meals={meals} setMeals={setMeals}/>,
    <HabitsScreen key="habitos" habits={habits} setHabits={setHabits} trackers={trackers} setTrackers={setTrackers}
      history={history} training={training} meals={meals} water={water}/>,
    <TodoScreen key="todo" todos={todos} setTodos={setTodos}/>,
    <WeekScreen key="semana" history={history} meals={meals} water={water} habits={habits} training={training} trackers={trackers}/>,
    <ProgressScreen key="progreso" weightLog={weightLog} setWeightLog={setWeightLog}/>,
  ];

  return (
    <div className="min-h-screen bg-cream dark:bg-navy transition-colors duration-300">
      <div className="max-w-md mx-auto relative min-h-screen">

        {/* Dark mode toggle */}
        <button onClick={() => setDarkMode(d => !d)}
          className="fixed top-4 right-4 z-20 w-9 h-9 rounded-full bg-cream2 dark:bg-navy2 shadow flex items-center justify-center active:scale-90 transition-transform max-w-md"
          style={{right:'calc(50% - 210px + 16px)', maxWidth:'calc(100vw - 32px)'}}>
          <Icon name={darkMode ? 'sun' : 'moon'} size={16} stroke={darkMode?'#F2D98A':'#1A2332'}/>
        </button>

        {/* Screen */}
        <div className="overflow-y-auto" style={{paddingTop:'0px',minHeight:'100vh'}}>
          {screens[tab]}
        </div>

        {/* Bottom nav */}
        <nav className="fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-navy/95 backdrop-blur-md border-t border-gray-100 dark:border-navy2 safe-pb z-20" style={{maxWidth:'448px',margin:'0 auto',left:'50%',transform:'translateX(-50%)'}}>
          <div className="flex">
            {tabs.map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={`flex-1 flex flex-col items-center gap-0.5 py-2.5 transition-all active:scale-90 relative ${tab===t.id ? 'text-sage' : 'text-ash'}`}>
                <div className="relative">
                  <Icon name={t.icon} size={20} stroke={tab===t.id?'#4A7C6F':'#6B7280'}/>
                  {t.badge && (
                    <span className="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-4 h-4 rounded-full flex items-center justify-center font-bold leading-none" style={{fontSize:'9px'}}>
                      {t.badge > 9 ? '9+' : t.badge}
                    </span>
                  )}
                </div>
                <span className="text-xs font-medium">{t.label}</span>
                {tab===t.id && <div className="absolute top-0 left-1/2 -translate-x-1/2 w-6 h-0.5 bg-sage rounded-full"/>}
              </button>
            ))}
          </div>
        </nav>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
